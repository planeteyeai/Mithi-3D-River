# Legacy static fallback (Dockerfile now uses Node Express).
# Kept for local nginx experiments only.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript
               application/javascript application/json
               model/gltf+json model/gltf-binary
               application/octet-stream;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;

    location ~* \.(jpg|jpeg|png|gif|ico|css|js|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location ~* \.(glb|gltf|bin|dae)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Access-Control-Allow-Origin "*";
    }

    location ~* \.(kml|kmz|geojson|tif)$ {
        expires 7d;
        add_header Cache-Control "public";
    }

    # Client uses /jalnetra-api + /api/... — strip only the proxy prefix
    location /jalnetra-api/ {
        proxy_pass https://jalnetra-software-production.up.railway.app/;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_set_header Host jalnetra-software-production.up.railway.app;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
    }

    location /rivereye-api/ {
        proxy_pass https://rivereye-production.up.railway.app/api/;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_set_header Host rivereye-production.up.railway.app;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
